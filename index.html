.card::after{content:"";position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,.85) 0,rgba(0,0,0,0) 45%)}
.info{position:absolute;left:18px;right:18px;bottom:18px;z-index:2}
.info h1{margin:0 0 6px;font-size:34px;font-weight:700}
.info h1 span{font-weight:400}
.info p{margin:0;font-size:17px;opacity:.95;line-height:1.3}
.stamp{position:absolute;top:34px;z-index:3;font-size:38px;font-weight:800;border:5px solid;border-radius:10px;padding:2px 14px;opacity:0;letter-spacing:2px}
.like{left:22px;color:#2ee59d;transform:rotate(-14deg)}
.nope{right:22px;color:#ff4458;transform:rotate(14deg)}
.btns{display:flex;justify-content:center;gap:34px;padding:16px 0 18px}
.btns button{width:68px;height:68px;border-radius:50%;border:0;background:#1e1e1e;font-size:32px;box-shadow:0 4px 14px rgba(0,0,0,.5);transition:transform .1s}
.btns button:active{transform:scale(.88)}
#no{color:#ff4458}#yes{color:#2ee59d}
#match{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:30px;background:linear-gradient(160deg,#fd267a,#ff7854);z-index:10;overflow:hidden}
#match.show{display:flex;animation:fade .5s}
@keyframes fade{from{opacity:0}to{opacity:1}}
#match h2{font-size:44px;margin:26px 0 10px;font-weight:800;font-style:italic;animation:pop .8s cubic-bezier(.2,1.6,.4,1) .3s both}
#match p{font-size:22px;margin:0;max-width:320px;line-height:1.35;animation:pop .8s cubic-bezier(.2,1.6,.4,1) .6s both}
@keyframes pop{from{transform:scale(0);opacity:0}to{transform:scale(1);opacity:1}}

.fl{position:absolute;bottom:-60px;animation:float linear forwards;pointer-events:none}
@keyframes float{to{transform:translateY(-120vh) rotate(40deg);opacity:0}}
#again{margin-top:34px;padding:12px 28px;border-radius:30px;border:2px solid #fff;background:transparent;color:#fff;font-size:17px;font-weight:600;animation:pop .8s ease 1.2s both}

<body>
<div id="app">
  <div class="top">🔥 quick match</div>
  <div id="stack">
    <div class="card" id="card">
      <div class="stamp like" id="sl">LIKE</div>
      <div class="stamp nope" id="sn">NOPE</div>
      <div class="info">
        <h1>Bartek <span>32</span></h1>
        <p>Próbuje kupić dom i zachować włosy</p>
      </div>
    </div>
  </div>
  <div class="btns"><button id="no">✕</button><button id="yes">♥</button></div>
</div>
<div id="match">
  <div class="pic"></div>
  <div class="heartbig">💗</div>
  <h2>Masz parę!</h2>
  <p>Możecie razem pojechać gdzieś 🚗</p>
  <div class="car">🚗💨</div>
  <button id="again">Jeszcze raz</button>
</div>
<script>
const card=document.getElementById('card'),sl=document.getElementById('sl'),sn=document.getElementById('sn'),match=document.getElementById('match');
let sx=0,dx=0,drag=false,busy=false;
const W=()=>innerWidth;
function setPos(x){card.style.transform=`translateX(${x}px) rotate(${x/18}deg)`;const p=Math.min(Math.abs(x)/(W()*.3),1);sl.style.opacity=x>0?p:0;sn.style.opacity=x<0?p:0}
card.addEventListener('pointerdown',e=>{if(busy)return;drag=true;sx=e.clientX;dx=0;card.style.transition='none';card.setPointerCapture(e.pointerId);card.style.cursor='grabbing'});
card.addEventListener('pointermove',e=>{if(!drag)return;dx=e.clientX-sx;setPos(dx)});
const end=()=>{if(!drag)return;drag=false;card.style.cursor='grab';if(dx>W()*.28)fly(1);else if(dx<-W()*.28)fly(-1);else{card.style.transition='transform .3s';setPos(0)}};
card.addEventListener('pointerup',end);card.addEventListener('pointercancel',end);
function fly(dir){busy=true;card.style.transition='transform .45s ease-in';sl.style.opacity=dir>0?1:0;sn.style.opacity=dir<0?1:0;card.style.transform=`translateX(${dir*W()*1.3}px) rotate(${dir*25}deg)`;setTimeout(()=>dir>0?showMatch():reset(),400)}
function reset(){card.style.transition='none';setPos(0);void card.offsetWidth;busy=false}
function showMatch(){match.classList.add('show');for(let i=0;i<30;i++){const f=document.createElement('div');f.className='fl';f.textContent=['💗','💖','❤️','💕'][i%4];f.style.left=Math.random()*100+'%';f.style.fontSize=(20+Math.random()*34)+'px';f.style.animationDuration=(2.5+Math.random()*3)+'s';f.style.animationDelay=(Math.random()*2.5)+'s';match.appendChild(f);setTimeout(()=>f.remove(),9000)}}
document.getElementById('yes').onclick=()=>{if(!busy)fly(1)};
document.getElementById('no').onclick=()=>{if(!busy)fly(-1)};
document.getElementById('again').onclick=()=>{match.classList.remove('show');reset()};
</script>
</body>
</html>
